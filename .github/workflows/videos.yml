# Bygger videos.json (senaste videorna, antal, serier, gänget) så att besökarna slipper anropa YouTube-API:t.
name: Videor
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: videos-build
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-videos.js
      - name: Spara om något ändrats
        run: |
          if ! git diff --quiet -- videos.json || [ -n "$(git ls-files --others --exclude-standard videos.json)" ]; then
            git config user.name "videor"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "Videor: uppdaterat från YouTube"
            git pull --rebase origin main
            git push
          fi
