# Uppdaterar live.json (LIVE NU-bannern på sajten) när Chris börjar eller slutar sända.
name: Live-koll
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: live-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/live-check.js
      - name: Spara om läget ändrats
        run: |
          if ! git diff --quiet -- live.json; then
            git config user.name "live-koll"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live.json
            git commit -m "Live-läge: $(node -p "require('./live.json').live ? 'LIVE' : 'offline'")"
            # Pipelinen eller admin kan ha pushat under tiden – lägg vår commit ovanpå.
            # Någon annan kan pusha samtidigt – försök upp till tre gånger.
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
