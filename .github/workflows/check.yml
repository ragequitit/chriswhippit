# Varnar om någon ändrat direkt i en sidfil i stället för i src/sida.html.
name: Kontroll
on:
  push:
    branches: [main]
    paths: ['**.html', 'src/**', 'tools/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.js --check
