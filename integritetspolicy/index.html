:root {
  --color-bg: #161826;
  --color-surface: #232532;
  --color-text: #e9e9ed;
  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to
     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro
     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel
     accent held (L 0.660, so the documented ratios survive) and chroma
     in the product blurple's own range (its token sits at C 0.118; the
     accent takes 0.125, from the old steel's 0.030):
     the accent now reads as an accent rather than another neutral. */
  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same
     hue, same L 0.734, chroma at the same 2:3 proportion it held */
  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f3f5fe;
  --color-neutral-200: #e4e7f5;
  --color-neutral-300: #cfd3e5;
  --color-neutral-400: #b2b6ca;
  --color-neutral-500: #9397ab;
  --color-neutral-600: #75798c;
  --color-neutral-700: #595d6c;
  --color-neutral-800: #3f424d;
  --color-neutral-900: #292b31;

  --color-accent-100: #f5f4ff;
  --color-accent-200: #e7e5fe;
  --color-accent-300: #d2cefd;
  --color-accent-400: #b5abfc;
  --color-accent-500: #968ae0;
  --color-accent-600: #796cbf;
  --color-accent-700: #5d5294;
  --color-accent-800: #423a6a;
  --color-accent-900: #2b2741;

  --color-accent-2-100: #f5f4ff;
  --color-accent-2-200: #e7e5fe;
  --color-accent-2-300: #d2cefd;
  --color-accent-2-400: #b5afe8;
  --color-accent-2-500: #9690c9;
  --color-accent-2-600: #7972a9;
  --color-accent-2-700: #5c5783;
  --color-accent-2-800: #423e5d;
  --color-accent-2-900: #2b293a;

  /* Deck section-divider ground — review round 3: saturation as presence.
     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own
     family; C 0.094 — written when the accent held C 0.030, before the
     round-7 blurple raised it past the ground's) with a lighter bloom and
     a ghost tint of the same hue, while the slide grounds stay
     desaturated. Deck-scale fills only — not interface colors. */
  --color-section: #262a60;
  --color-section-glow: #353b80;
  --color-section-ghost: #4c5397;

  --font-heading: "Inter", system-ui, sans-serif;
  --font-heading-weight: 500;
  --font-body: "Inter", system-ui, sans-serif;

  --space-1: 2.8px;
  --space-2: 5.6px;
  --space-3: 8.4px;
  --space-4: 11.2px;
  --space-6: 16.8px;
  --space-8: 22.4px;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 0 0 1px #3f424d;
  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);
  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
/* Rules fade to transparent at both ends instead of stopping cleanly — a
   Nocturne signature. The ramp is 48px an end (one deck baseline unit),
   painted from the same divider token. Freestanding rules fade; box
   outlines, in-control separators, and short accent marks stay solid. */
.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: linear-gradient(to right,
    transparent, var(--color-divider) 48px,
    var(--color-divider) calc(100% - 48px), transparent);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }

.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }

.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }

  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}

.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {

  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);

.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {

.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: none;
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);

}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid transparent;
}
/* Row rules as row-level strips so the end-fade spans the row, not each cell. */
.table thead tr {
  background: linear-gradient(to right,
    transparent, var(--color-divider) 48px,
    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;

/* — dialog — */
.dialog-backdrop {

  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);

  <sc-if value="{{ atPriv }}">
  <main style="max-width: 900px; margin: 0 auto; padding: 72px 24px 0;">
    <h1 data-en="Privacy policy" style="font-family: var(--font-heading); font-weight: 500; font-size: clamp(38px, 6vw, 76px); letter-spacing: -.04em; margin: 0 0 14px;">Integritetspolicy</h1>
    <p style="font-family: 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--color-neutral-500); margin: 0 0 26px;" data-en="Last updated 14 October 2026">Senast uppdaterad 14 oktober 2026</p>
    <sc-if value="{{ isSv }}">
    <article data-prose="" style="font-size: 16px; line-height: 1.75; color: #d6d3e6;">
      <p style="margin: 0 0 14px;">Den här sidan beskriver vilka uppgifter som hanteras när du besöker chriswhippit.com, varför, och vad du kan göra åt det. Kort sagt: sajten har inga konton, ingen egen besöksstatistik och visar bara annonser om du har godkänt det.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Vem ansvarar?</h2>
      <p style="margin: 0 0 14px;">Chris Whippit är ansvarig för sajten och för personuppgifterna som behandlas här. Frågor om din integritet skickar du till <a href="mailto:chris.whippit@gmail.com">chris.whippit@gmail.com</a>.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Annonser från Google AdSense</h2>
      <p style="margin: 0 0 14px;">Sajten kan visa annonser från Google AdSense. Annonser laddas bara om du har tryckt <em>Godkänn</em> i cookie-rutan. Då använder Google cookies och liknande tekniker för att visa, mäta och eventuellt anpassa annonserna efter dina intressen. Trycker du <em>Neka</em> laddas inga annonser och inga annonscookies sätts &ndash; sajten fungerar precis likadant ändå.</p>
      <p style="margin: 0 0 14px;">Läs mer om hur Google använder uppgifter i <a href="https://policies.google.com/technologies/partner-sites" target="_blank" rel="noopener">Googles policy för partnerwebbplatser</a>. Du kan styra annonsanpassning i <a href="https://adssettings.google.com" target="_blank" rel="noopener">Googles annonsinställningar</a>.</p>
      <sc-if value="{{ adsOn }}"><p style="margin: 0 0 14px;"><button sc-camel-on-click="{{ reopenConsent }}" data-ck="" style="cursor: pointer; font: inherit; font-size: 14px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--color-accent); background: transparent; color: var(--color-accent-200);">Ändra ditt cookieval</button></p></sc-if>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">YouTube</h2>
      <p style="margin: 0 0 14px;">Startsidan, schemat och samarbetssidan hämtar uppgifter om videor (titlar, bilder och antal visningar) direkt från YouTube, som drivs av Google. Din webbläsare kontaktar då Googles servrar, vilket innebär att Google får se din IP-adress. Videor på samarbetssidan bäddas in först när du trycker på play, och då via youtube-nocookie.com. Se <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Googles integritetspolicy</a>.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Shoppen</h2>
      <p style="margin: 0 0 14px;">Butiken på shop-sidan drivs av Spreadshirt och laddas från deras servrar. Spreadshirt visar en egen cookie-ruta och hanterar varukorg, betalning och leverans. Det de gör regleras av <a href="https://www.spreadshirt.se/integritetspolicy-C3104" target="_blank" rel="noopener">Spreadshirts integritetspolicy</a>.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Spelen</h2>
      <p style="margin: 0 0 14px;">De mindre spelen på spelsidan sparar dina framsteg, rekord och ljudinställningar i din egen webbläsare (localStorage). Uppgifterna skickas inte till oss och försvinner om du rensar webbplatsdata. Project Genesis på games.chriswhippit.com är en egen tjänst med egna konton.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Det som sparas i din webbläsare</h2>
      <p style="margin: 0 0 14px;">Förutom spelens framsteg sparar sajten ditt svar i cookie-rutan och en kopia av de senaste videolistorna så att sidan laddar snabbare. Inget av detta skickas till oss.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Webbhotell</h2>
      <p style="margin: 0 0 14px;">Sajten ligger på GitHub Pages (GitHub Inc.). Som alla webbservrar kan GitHub tillfälligt logga tekniska uppgifter som din IP-adress för drift och säkerhet. Se <a href="https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener">GitHubs integritetspolicy</a>.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Uppgifter utanför EU</h2>
      <p style="margin: 0 0 14px;">Google och GitHub är amerikanska företag, så uppgifter kan föras över till USA. Båda är anslutna till EU&ndash;US Data Privacy Framework, som EU-kommissionen har beslutat ger en adekvat skyddsnivå.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">När du mejlar</h2>
      <p style="margin: 0 0 14px;">Mejlar du oss, till exempel om ett samarbete, används din adress och det du skriver bara för att svara dig och sparas inte längre än nödvändigt.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Länkar till andra sajter</h2>
      <p style="margin: 0 0 14px;">Länkar till YouTube, Twitch, Instagram, TikTok, X och Discord leder till tjänster med egna villkor och integritetspolicyer.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Dina rättigheter</h2>
      <p style="margin: 0 0 14px;">Du har rätt att få veta vilka uppgifter om dig som behandlas, få fel rättade, få uppgifter raderade och invända mot behandling. Hör av dig till <a href="mailto:chris.whippit@gmail.com">chris.whippit@gmail.com</a>. Är du missnöjd kan du klaga hos <a href="https://www.imy.se" target="_blank" rel="noopener">Integritetsskyddsmyndigheten (IMY)</a>.</p>
    </article>
    </sc-if>
    <sc-if value="{{ isEn }}">
    <article data-prose="" style="font-size: 16px; line-height: 1.75; color: #d6d3e6;">
      <p style="margin: 0 0 14px;">This page explains what data is handled when you visit chriswhippit.com, why, and what you can do about it. In short: the site has no accounts, no analytics of its own, and only shows ads if you have accepted them.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Who is responsible?</h2>
      <p style="margin: 0 0 14px;">Chris Whippit is responsible for the site and for the personal data processed here. Send questions about your privacy to <a href="mailto:chris.whippit@gmail.com">chris.whippit@gmail.com</a>.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Ads from Google AdSense</h2>
      <p style="margin: 0 0 14px;">The site may show ads from Google AdSense. Ads only load if you have pressed <em>Accept</em> in the cookie box. Google then uses cookies and similar technologies to show, measure and possibly personalise the ads. If you press <em>Decline</em>, no ads load and no ad cookies are set &ndash; the site works exactly the same.</p>
      <p style="margin: 0 0 14px;">Read more about how Google uses data in <a href="https://policies.google.com/technologies/partner-sites" target="_blank" rel="noopener">Google’s policy for partner sites</a>. You can control ad personalisation in <a href="https://adssettings.google.com" target="_blank" rel="noopener">Google’s ad settings</a>.</p>
      <sc-if value="{{ adsOn }}"><p style="margin: 0 0 14px;"><button sc-camel-on-click="{{ reopenConsent }}" data-ck="" style="cursor: pointer; font: inherit; font-size: 14px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--color-accent); background: transparent; color: var(--color-accent-200);">Change your cookie choice</button></p></sc-if>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">YouTube</h2>
      <p style="margin: 0 0 14px;">The home page, the schedule and the partnerships page fetch video details (titles, images and view counts) directly from YouTube, which is run by Google. Your browser then contacts Google’s servers, which means Google sees your IP address. Videos on the partnerships page are only embedded when you press play, and then via youtube-nocookie.com. See <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google’s privacy policy</a>.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">The shop</h2>
      <p style="margin: 0 0 14px;">The shop is run by Spreadshirt and loads from their servers. Spreadshirt shows its own cookie box and handles the cart, payment and delivery, as described in <a href="https://www.spreadshirt.se/integritetspolicy-C3104" target="_blank" rel="noopener">Spreadshirt’s privacy policy</a>.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">The games</h2>
      <p style="margin: 0 0 14px;">The smaller games save your progress, high scores and sound settings in your own browser (localStorage). This data is not sent to us and disappears if you clear site data. Project Genesis at games.chriswhippit.com is a separate service with its own accounts.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">What is stored in your browser</h2>
      <p style="margin: 0 0 14px;">Apart from game progress, the site stores your answer in the cookie box, your language choice and a copy of the latest video lists so the page loads faster. None of this is sent to us.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Hosting</h2>
      <p style="margin: 0 0 14px;">The site is hosted on GitHub Pages (GitHub Inc.). Like all web servers, GitHub may briefly log technical details such as your IP address for operations and security. See <a href="https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener">GitHub’s privacy statement</a>.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Data outside the EU</h2>
      <p style="margin: 0 0 14px;">Google and GitHub are US companies, so data may be transferred to the United States. Both participate in the EU&ndash;US Data Privacy Framework, which the European Commission has found to provide an adequate level of protection.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">When you email</h2>
      <p style="margin: 0 0 14px;">If you email us, for example about a partnership, your address and message are only used to reply to you and are not kept longer than necessary.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Links to other sites</h2>
      <p style="margin: 0 0 14px;">Links to YouTube, Twitch, Instagram, TikTok, X and Discord lead to services with their own terms and privacy policies.</p>
      <h2 style="font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -.02em; color: #fff; margin: 34px 0 10px;">Your rights</h2>
      <p style="margin: 0 0 14px;">You have the right to know what data about you is processed, to have errors corrected, to have data deleted and to object to processing. Contact <a href="mailto:chris.whippit@gmail.com">chris.whippit@gmail.com</a>. If you are unhappy, you can complain to the Swedish Authority for Privacy Protection <a href="https://www.imy.se/en/" target="_blank" rel="noopener">(IMY)</a>.</p>
    </article>
    </sc-if>
  </main>
  </sc-if>

        return v || null;
      };

      const top = [hero, take(null)].concat(locked).filter(Boolean);

        const crewInfo = this.state.crewInfo || {}, crewVids = this.state.crewVids || {};
        return {
          seriesCards: series.map((x) => { const cov = x.cover || (this.state.covers || {})[x.slug]; return { title: pick(L, x, 'title'), lead: pick(L, x, 'lead'), href: '/videor/' + x.slug + '/', onGo: this.goSerie(x.slug), thumb: cov ? 'https://i.ytimg.com/vi/' + cov + '/hqdefault.jpg' : '' }; }),
          channelCards: (c.stats || []).filter((x) => CH[x.platform]).map((x) => ({ name: CH[x.platform][0], handle: x.platform, subs: x.value, about: CH[x.platform][L === 'en' ? 2 : 1], url: 'https://www.youtube.com/' + x.platform })),
          morePl: (c.morePlaylists || []).map((p) => ({ title: pick(L, p, 'title'), url: plUrl(p.id), count: cnt(p.id) })),
          sTitle: s ? pick(L, s, 'title') : (L === 'en' ? 'Not found' : 'Hittades inte'),
          sLead: s ? pick(L, s, 'lead') : '', sMissing: s ? '' : '1',
          sBlocks: s ? blocks(pick(L, s, 'text')) : [],
          sPlaylists: s ? (s.playlists || []).map((p) => ({ title: pick(L, p, 'title'), url: plUrl(p.id), count: cnt(p.id) })) : [],
          sVideos: sv.map((v) => ({ title: v.title, date: dfmt(v.at), thumb: 'https://i.ytimg.com/vi/' + v.id + '/mqdefault.jpg', url: 'https://www.youtube.com/watch?v=' + v.id + '&list=' + v.list })),
          sHasVideos: sv.length ? '1' : '',
          crewCards: (c.crew || []).map((m) => { const info = crewInfo[m.channelId] || {}; return {
            name: m.name, channelName: m.channelName || info.title || m.name, memorial: m.memorial || '', text: pick(L, m, 'text'),
            avatar: info.avatar || '', noAvatar: info.avatar ? '' : '1', initial: (m.name || '?').slice(0, 1).toUpperCase(), subs: info.subs ? kfmt(info.subs) + (L === 'en' ? ' subscribers' : ' prenumeranter') : '',
            channelUrl: 'https://www.youtube.com/' + (m.handle || 'channel/' + m.channelId), subUrl: 'https://www.youtube.com/channel/' + m.channelId + '?sub_confirmation=1',
            hasAlso: (m.also || []).length ? '1' : '',
            also: (m.also || []).map((a) => { const ai = crewInfo[a.channelId] || {}; return { name: a.name, url: 'https://www.youtube.com/' + (a.handle || 'channel/' + a.channelId), subs: ai.subs ? kfmt(ai.subs) : '' }; }),
            videos: (m.videos || []).map((id) => ({ title: (crewVids[id] || {}).title || '', date: dfmt((crewVids[id] || {}).at), thumb: 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg', url: 'https://www.youtube.com/watch?v=' + id })),
          }; }),
        };
      })(),
      atCollab: r === 'samarbeten' ? '1' : '',
      collabReady: this.state.contentReady ? '1' : '',
      liveOn: this.state.liveNow ? '1' : '',
      liveUrl: (this.state.liveNow && this.state.liveNow.url) || 'https://www.twitch.tv/chriswhippit',
      liveText: this.state.liveNow ? [this.state.liveNow.title, this.state.liveNow.platform === 'youtube' ? 'YouTube' : 'Twitch'].filter(Boolean).join(' · ') : '',
      vReady: this.state.contentReady ? '1' : '',  // serier/gänget kommer från content.json — visa först då, så inget hoppar (CLS)
      goCollab: this.go('samarbeten'),
      ...(() => {
        const st = this.state.collabStats;
        const nf = (n) => Number(n).toLocaleString('sv-SE');
        const sel = Math.max(0, Math.min(this.state.collab || 0, marked.length - 1));
        const items = marked.map((s, i) => {
          const id = ytId(s.url);
          return {
            ...s, id, v: st && st[id], name: String(s.name || '').trim(), active: i === sel ? '1' : '',
            onPick: () => {
              this.setState({ collab: i, collabPlay: false });
              try { history.replaceState(history.state, '', '#' + collabSlug(s.name)); } catch (e) {}
              if (window.innerWidth < 900) { const el = document.querySelector('[data-collab-detail]'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
            }
          };
        });
        const c = items[sel] || {};
        const v = c.v;
        const total = st ? items.reduce((n, it) => n + (it.v ? it.v.views : 0), 0) : 0;
        const play = !!(this.state.collabPlay && c.id);
        return {
          collabItems: items,
          collabCount: items.length,
          collabTotal: total ? nf(total) : '',
          collabTotalShow: st ? (total ? nf(total) : '–') : '…',
          cName: c.name || '', cCaption: c.caption || '', cUrl: c.url || '',
          cDesc: String(c.desc || '').split(/\n\s*\n/).map((x) => x.trim()).filter(Boolean).map((x) => ({ parts: faqParts(x) })),
          cHasDesc: String(c.desc || '').trim() ? '1' : '',
          cLogo: c.logo || '', cHasLogo: c.hasLogo || '', cTf: c.tf || '',
          cHasVideo: c.id ? '1' : '', cThumb: c.id ? 'https://i.ytimg.com/vi/' + c.id + '/hqdefault.jpg' : '',
          cPlay: play ? '1' : '', cNoPlay: c.id && !play ? '1' : '',
          cEmbed: c.id ? 'https://www.youtube-nocookie.com/embed/' + c.id + '?autoplay=1&rel=0' : '',
          playCollab: () => this.setState({ collabPlay: true }),
          cLoading: st ? '' : '1',
          cHasStats: v ? '1' : '',
          cTitle: v ? v.title : '', cViews: v ? nf(v.views) : '', cLikes: v && v.likes ? nf(v.likes) : '', cChannel: v ? v.channel : '',
          cDate: v ? new Date(v.at).toLocaleDateString(this.state.lang === 'en' ? 'en-GB' : 'sv-SE', { year: 'numeric', month: 'long', day: 'numeric' }) : ''
        };
      })(),
      goSpel: this.go('spel'),
      games: GAMES.map((g, i) => ({ ...g, thumb: SITE_ROOT + 'spel/thumbs/' + g.slug + '-board.webp', src: SITE_ROOT + 'spel/' + g.slug + '.html', num: String(i + 1).padStart(2, '0'), ring: this.state.game === g.slug ? '0 0 0 1px var(--color-accent)' : '0 0 0 1px var(--color-neutral-800)', onPlay: () => { document.body.style.overflow = 'hidden'; this.setState({ game: g.slug }); } })),
      hasGame: this.state.game ? true : '',
      gameSrc: this.state.game ? SITE_ROOT + 'spel/' + this.state.game + '.html' : '',
      gameTitle: (GAMES.find((g) => g.slug === this.state.game) || {}).title || '',
      gameClose: () => { document.body.style.overflow = ''; this.setState({ game: null }); },
      gameFull: () => { const f = document.getElementById('cw-game-frame'); if (f && f.requestFullscreen) f.requestFullscreen(); },
      goHem: this.go('hem'),
      goSetup: this.go('setup'),
      goSchema: this.go('schema'),
      goFaq: this.go('faq'),
      goDl: this.go('dl'),
      goShop: this.go('shop'),
      langLabel: this.state.lang === 'sv' ? 'SV / EN' : 'EN / SV',
      toggleLang: () => this.setState((s) => { const lang = s.lang === 'sv' ? 'en' : 'sv'; try { localStorage.setItem('cw-lang', lang); } catch (e) {} return { lang }; })
    };
  }
}

</script>
