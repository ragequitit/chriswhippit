/* Layout: en ram som spelets AH-fönster: titelremsa med myntmedaljong, sökrad, varulistan till vänster och den valda
   varan (nyckeltal, graf, prissteg) till höger; på mobil hamnar varan ovanför listan. Ett enda mörkt utseende, med flit:
   sidan ska se ut som AH-fönstret i spelet och som addonets panel. */
:root {
  color-scheme: dark;
  /* Paletten ur Joakims visuella överlämning 2026-11-16 (mockup: Orgrimmar-panorama, varm brun ram, ljusguld). */
  --bg: #130F0D;          /* sidans grund, under panoramat */
  --panel: #151210;       /* huvudpanelen, ogenomskinlig över panoramat */
  --inset: #100E0D;       /* sökfält, tabell, sidopaneler */
  --alt: #191613;         /* varannan tabellrad */
  --line: #3A2E23;        /* inre kant */
  --bronze: #795934;      /* yttre kant runt huvudpanelen */
  --fg: #EEE6D9;
  --grey: #B9AEA1;        /* dämpad text */
  --gold: #F2CA74;        /* ljusguld: huvudrubrik, markerade detaljer */
  --edge: #F6C448;        /* varmgult: aktiv flik, sorteringsmarkör, fokus */
  --green: #7fd49a;
  --red: #ff5a4a;
  --silver: #c9ccd3;
  --copper: #d08a4e;
  --btn-a: #631C13;        /* mörkröd knapp */
  --btn-b: #35110F;
  --hover: rgba(246, 196, 72, .14);
  --sel: rgba(246, 196, 72, .10);
  --q0: #9d9d9d; --q1: #ffffff; --q2: #1eff00; --q3: #0070dd; --q4: #a335ee; --q5: #ff8000;
  --display: "Cinzel", Georgia, "Times New Roman", serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
/* Panoramat (Orgrimmar för Horde, Stormwind för Alliance) ligger som ett dekorativt lager överst på sidan, hela bredden,
   och tonas mot grundfärgen nedåt. Bilden sätts i JS (ASSET_BASE) så kopian utan bilder klarar sig. */
body {
  font-family: var(--body); font-size: 14.5px; line-height: 1.4;
  background-repeat: no-repeat; background-position: center top; background-size: 100% auto;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-variant-numeric: tabular-nums;
}
.win { width: max(81%, min(100%, 1240px)); max-width: 1560px; margin: 0 auto; background: transparent; border: 1px solid var(--bronze); border-radius: 7px; overflow: hidden;
  box-shadow: inset 0 0 0 1px var(--line), 0 14px 36px rgba(0, 0, 0, .42); }
/* Frostat sidhuvud (Joakim 2026-11-16): panoramat skymtar suddigt bakom, med fraktionstonen ovanpå och en toning som
   blir tät nedåt mot panelen. Fönstret är genomskinligt bara här; .bar, .cols och .foot bär panelfärgen. */
.top { position: relative; z-index: 5; display: flex; align-items: center; gap: 16px; min-height: 104px; padding: 14px 18px; flex-wrap: wrap;
  background: linear-gradient(rgba(42, 30, 21, .55), rgba(21, 18, 16, .92)); border-bottom: 1px solid var(--line); border-radius: 7px 7px 0 0;
  box-shadow: inset 0 1px 0 rgba(229, 180, 106, .10); -webkit-backdrop-filter: blur(10px) saturate(1.15); backdrop-filter: blur(10px) saturate(1.15); }   /* z-index: marknadsväljaren ska ligga över flikarnas ikoner (filter på .mi gör egna lager; Joakim 2026-11-17) */
.win > :not(.top) { background: var(--panel); }
/* Fraktionston i rubriklisten (Joakim 2026-11-16): Horde-röd eller Alliance-blå, svagt, så hela sidan följer flippen. */
.fa-horde .top { background: linear-gradient(rgba(59, 26, 19, .5), rgba(26, 16, 12, .85) 70%, rgba(21, 18, 16, .95)); }
.fa-alliance .top { background: linear-gradient(rgba(23, 36, 61, .5), rgba(16, 21, 31, .85) 70%, rgba(21, 18, 16, .95)); }

.logo:not([src]) { display: none; }
.title { min-width: 0; flex: 0 1 auto; }
/* Sök överallt (sidhuvudet): rutan mellan titeln och Style, rullgardinen under den */
.gs { position: relative; flex: 1 1 300px; max-width: 560px; min-width: 200px; align-self: center; }
.gs input { box-sizing: border-box; width: 100%; height: 42px; padding: 0 12px 0 38px; font: inherit; font-size: 15px; color: var(--fg); background: var(--inset); border: 1px solid var(--line); border-radius: 6px; outline: none; }

/* Dator: hela fönstret ryms på skärmen och bara listan (och varuvyn) rullar inuti sin ram, som i spelets AH. */
@media (min-width: 1101px) {
  html, body { height: 100%; }

  .win { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; }
  .win > .top, .win > .bar, .win > .foot { flex: none; }   /* sidhuvudet får inte krympa när innehållet växer (Joakim 2026-11-17: strecket under emblemet hoppade) */
  .cols { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); align-items: stretch; }
  .left, .right { display: flex; flex-direction: column; min-height: 0; }
  .cats { align-self: stretch; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--edge) var(--inset); }
  .left .scroll, .left .armory, .right .detail { flex: 1 1 auto; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--edge) var(--inset); }
  .cats, .left .scroll, .left .armory, .right .detail { position: relative; top: auto; scrollbar-gutter: stable; }   /* buggsvep 2026-11-17: .sr-spannen läckte ut och sidan blev rullbar; rullisten flyttade innehållet */
  .right .detail { align-content: start; }

  .foot { padding-block: 8px 10px; }

body[data-mode=qu] .cols { grid-template-columns: 224px minmax(0, 360px) minmax(0, 1fr); }

  .hide-s { display: none; }
  /* Telefon (Joakim 2026-11-16: siffrorna gick ihop): tabellen får bredd efter innehållet i stället för lika breda

/* Tooltipen som i spelet: Wowheads text, rensad i build.js. */

  white-space: normal; overflow: visible; text-overflow: clip; max-width: none; position: static; background: none; color: inherit;
  font-size: inherit; text-transform: none; letter-spacing: normal; }

.wtip .q4 { color: #a335ee; } .wtip .q5 { color: #ff8000; } .wtip .q6 { color: #e6cc80; } .wtip .q7 { color: #0cf; } .wtip .q8 { color: #0cf; }
.wtip .q9 { color: #71d5ff; } .wtip .q10 { color: #ff4040; } .wtip .toycolor { color: #66bbff; } .wtip .c { color: #ffd100; }
.wtip .whtt-droppedby { color: #9d9d9d; font-size: 12px; }
/* Mynten som i spelet (Joakim 2026-11-16): guld, silver, koppar efter siffran. */
.coin, .wtip .moneygold::after, .wtip .moneysilver::after, .wtip .moneycopper::after { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%;
  vertical-align: -1px; box-shadow: inset 0 -2px 2px rgba(0, 0, 0, .45), inset 0 1px 1px rgba(255, 255, 255, .45), 0 0 0 1px rgba(0, 0, 0, .5); }
.coin.g, .wtip .moneygold::after { background: radial-gradient(circle at 35% 30%, #ffe680, #d6a83b 55%, #8a6514); }
.coin.s, .wtip .moneysilver::after { background: radial-gradient(circle at 35% 30%, #ffffff, #c0c0c0 55%, #6e6e6e); }
.coin.c, .wtip .moneycopper::after { background: radial-gradient(circle at 35% 30%, #f0b07a, #c7793f 55%, #6a3a14); }
.wtip .moneygold::after, .wtip .moneysilver::after, .wtip .moneycopper::after { margin-left: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wtip .ah { margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(255, 255, 255, .15); color: #ffd100; }
.wtip .ln { display: flex; justify-content: space-between; gap: 14px; } .wtip .ln .r { text-align: right; white-space: nowrap; }
/* Läget: Auction house eller Trading, som flikar med en tunn guldlinje under den aktiva (mockupen). */

.mode button { all: unset; cursor: pointer; height: 40px; padding: 0 16px 0 12px; font-size: 14.5px; color: var(--grey); display: inline-flex; align-items: center; gap: 8px; margin-bottom: -1px; }

.bar { padding: 0 18px 12px; row-gap: 14px; }

  // Fyra marknader (Blizzards hus): data.json = EU PvP Horde (113), data-<hus>.json för de andra. Historiken per vara

  function mySide() { var p = houseParts(house); return p && p[1] !== "blackwater" ? p[1] : side; }
  // Länk till en vara: #item=4306 (och &m=hus för en annan marknad än EU PvP Horde). Adressen uppdateras när man väljer

  function hashParams() {
    var o = {}, h = location.hash.replace(/^#/, "");

  var navRestoring = true, navSkip = false;
  function sameHash(a, b) { try { return decodeURIComponent(a) === decodeURIComponent(b); } catch (e) { return a === b; } }   // å/ä/ö i adressen är %-kodade

  // Prisgrafen: två paneler. Överst riktpriset per scan, underst antalet ute som en blå linje med fyllning. Hover visar
  // scannen i raden under (readout).
  function chart(r, Hh) {
    var T = Hh.T, W = 600, H = 260, L = 82, R = 12, TOP = 14, PH = 140, QH = 56, QY = TOP + PH + 18;
    var pts = [], maxP = 0, maxQ = 0;
    var secs = 0;
    RANGES.forEach(function (rg) { if (rg[0] === rangeKey) secs = rg[1]; });   // (span nedan är tidsaxelns bredd)

      if (Hh.rh[i] > 0 && T[i] >= from) { pts.push(i); maxP = Math.max(maxP, Hh.rh[i]); maxQ = Math.max(maxQ, Hh.qh[i]); }
    }
    if (pts.length < 2) return '<div class="note">' + t("few_scans") + "</div>";
    var t0 = T[pts[0]], t1 = T[pts[pts.length - 1]], span = Math.max(1, t1 - t0);
    function x(i) { return L + (T[i] - t0) / span * (W - L - R); }

        '<text x="' + (L - 6) + '" y="' + (y(p) + 4) + '" text-anchor="end" font-size="19" font-weight="600" fill="#b9aea1">' + moneyText(p) + "</text>";
    });

    // timme med klockslag.

      if (mx - lastX > 40 && mx + 3 + 54 <= W) {

      '<polygon fill="#7ea2d6" fill-opacity=".18" points="' + x(pts[0]).toFixed(1) + "," + (QY + QH) + " " + qpts + " " + x(pts[pts.length - 1]).toFixed(1) + "," + (QY + QH) + '"/>' +
      '<polyline fill="none" stroke="#7ea2d6" stroke-width="1.5" points="' + qpts + '"/>' +
      '<text x="' + (L - 6) + '" y="' + (QY + 10) + '" text-anchor="end" font-size="19" font-weight="600" fill="#b9aea1">' + num(maxQ) + "</text>" +
      '<text x="' + (L - 6) + '" y="' + (QY + QH + 4) + '" text-anchor="end" font-size="19" font-weight="600" fill="#b9aea1">0</text>';
    // riktpris
    s += '<polyline fill="none" stroke="#d6a83b" stroke-width="2" points="' + pts.map(function (i) { return x(i).toFixed(1) + "," + y(Hh.rh[i]).toFixed(1); }).join(" ") + '"/>';

  // Morgon och kväll per dag: två staplar per dag (guld morgon 05–12, grå kväll 17–24), snitt av riktpriset i blocket.
  // Det är det en tradare vill se: köp i det billiga blocket, sälj i det dyra. Samma block som addonets Trading-flik.
  function blockOf(ts) { var h = new Date(ts * 1000).getHours(); return h >= 5 && h < 12 ? "m" : (h >= 17 ? "e" : null); }
  function dayKey(ts) { var dd = new Date(ts * 1000); return dd.getFullYear() * 10000 + (dd.getMonth() + 1) * 100 + dd.getDate(); }
  function dayData(r, Hh) {
    var T = Hh.T, days = {}, order = [];
    var secs = 0;
    RANGES.forEach(function (rg) { if (rg[0] === rangeKey) secs = rg[1]; });
    var from = secs ? D.t - secs : 0;
    for (var i = 0; i < T.length; i++) {
      if (!(Hh.rh[i] > 0) || T[i] < from) continue;
      var b = blockOf(T[i]);
      if (!b) continue;
      var k = dayKey(T[i]);
      if (!days[k]) { days[k] = { key: k, m: [], e: [], mq: 0, eq: 0 }; order.push(k); }

    });
  }
  function dayChart(r, Hh) {

    if (!days.length) return '<div class="note">' + t("dd_none") + "</div>";
    var W = 600, H = 150, L = 82, R = 12, TOP = 12, BH = 108, BASE = TOP + BH;
    var maxP = 1;
    days.forEach(function (dd) { maxP = Math.max(maxP, dd.m, dd.e); });
    var gw = (W - L - R) / Math.max(days.length, 4);
    var bw = Math.min(22, Math.floor((gw - 10) / 2));
    var x0 = L + ((W - L - R) - days.length * gw) / 2;
    var s = '<svg class="chart chart2" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + t("dayday") + '">';

  $("mktPop").addEventListener("click", function (e) {   // panelen ligger kvar: fraktion och servertyp kan bytas i samma öppning
    var b = e.target.closest("button");
    if (!b) return;
    if (b.disabled) return;
    var hp = houseParts(house) || ["pvp", "horde", "eu"], bw = hp[1] === "blackwater";
    if (b.getAttribute("data-fa")) { side = b.getAttribute("data-fa"); try { localStorage.setItem(SIDE_KEY, side); } catch (e3) {} }
    var rs = b.getAttribute("data-rs") || hp[0], fa = bw ? "blackwater" : mySide(), rg = b.getAttribute("data-rg") || hp[2];
    var h = mkHas(mkKey(rg, rs, fa)) && (rg === "eu" || rg === "us" || rs === "pvp" || rs === "normal") ? mkKey(rg, rs, fa) : mkNear(rg, rs, fa);
    switchHouse(h);
  });
  function switchHouse(h) {
    if (h === house) { drawMarket(); drawSub(); return; }   // bara sidan bytt medan Blackwater visas: tinten och underflikarna följer med
    house = h;
    drawMarket(); drawSub();
    try { localStorage.setItem(MARKET_KEY, String(house)); } catch (e2) {}
    lastUpdate = null;
    var tok = ++dataSeq, hh = house, c = dataCache[hh];
    // Huset i minnet om det hämtades för mindre än 10 minuter sedan, annars no-cache (304 om filen inte ändrats) (granskning 2026-11-18)
    if (c && Date.now() - c.t < DATA_TTL) { load(c.d, !!D); return; }
    fetch(dataUrl(), { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { gotData(hh, d); if (tok === dataSeq) load(d, !!D); }).catch(function () { if (tok === dataSeq) showError(); });
  }
  $("trsub").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-trv]"); if (!b) return;
    var k = b.dataset.trv;
    if (k === "de" || k === "fx") { setMode(k); return; }
    trView = k; trSort(k);
    if (mode !== "tr") { setMode("tr"); return; }   // setMode ritar om; resetModeState sätter sorteringen efter trView
    drawTrSub(); refresh(); toTop();
  });
  $("ahsub").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-sub]"); if (!b) return;
    var k = b.dataset.sub;
    if (k === "tr") { if (mode !== "tr") setMode("tr"); switchHouse(houseFor(side)); return; }   // Trading: alltid ditt faction-AH
    if (mode !== "ah") setMode("ah");
    switchHouse(houseFor(k === "bw" ? "blackwater" : k === "other" ? otherSide() : side));
  });
  // Sökknappen (som i spelets AH): söker på det som står i rutan, även tomt = hela AH. Den hämtar inte data.json
  // (granskning 2026-11-18: Enter i sökrutan laddade om 2 MB varje gång); Hem och Update prices hämtar nytt.
  $("qbtn").addEventListener("click", function () {
    qFlush();
    if (mode === "ar") { $("q").blur(); showTab("item"); arLookup($("q").value); return; }
    query = $("q").value.trim().toLowerCase(); refresh(); $("q").blur();
  });
  $("q").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); $("qbtn").click(); } });
  if (location.hash === "#about") aboutOpen();   // länk direkt till About (Joakim 2026-11-18)
  var tok0 = ++dataSeq, house0 = house;
  fetch(dataUrl()).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function (d) { gotData(house0, d); if (tok0 === dataSeq) load(d); }).catch(function () {   // sparas per hus (granskning 2026-11-18)
    failed = true;
    showError();
  });
})();
</script>
